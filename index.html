<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f5"><title>Shopping List</title><link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
<div class="app">
<header><div><h1 id="title">Shopping List</h1></div></header>
<main>
<section id="shoppingView">
<div class="summary"><div><strong id="itemCount">0 items</strong><span>on your list</span></div><div class="total"><span>Estimated</span><strong id="total">$0.00</strong></div></div>
<div id="shoppingGroups"></div>
<div id="completedWrap" class="completed-wrap hidden"><div class="section-toggle cart-heading"><span>Cart</span><span id="completedCount">0</span></div><div id="completedList"></div><button id="clearPurchased" class="text-btn">Clear cart</button></div>
</section>
<section id="pantryView" class="hidden">
<div class="search"><span>⌕</span><input id="search" placeholder="Search pantry…" autocomplete="off"></div>
<div class="chips" id="chips"></div><div id="pantryList"></div><button class="missing-item hidden" id="missingItem">Item missing? Click here to add it</button>
</section>
<section id="recipesView" class="hidden">
<div class="recipe-tools"><div class="search"><span>⌕</span><input id="recipeSearch" placeholder="Search recipes…" autocomplete="off"></div><button class="recipe-top-add" id="addRecipeBtn">New Recipe</button></div>
<div id="recipeList"></div>
</section>
</main><button class="fab" id="addBtn" aria-label="Add item">Add Item?</button>
<nav><button data-view="shopping" class="active"><span>✓</span>Shopping</button><button data-view="pantry"><span>▦</span>Pantry</button><button data-view="recipes"><span>☷</span>Recipes</button></nav>
</div>
<div class="modal hidden" id="modal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Add item</h2><button id="closeModal">×</button></div><label>Item name<input id="customName" placeholder="What do you need?"></label><label class="category-label">Category<select id="customCategory"></select></label><div class="row"><label>Quantity<input id="customQty" type="number" min="1" value="1"></label><label>Price<input id="customPrice" type="number" min="0" step=".01" placeholder="0.00"></label></div><label class="note-label">Note (optional)<input id="customNote" placeholder="Add a note…"></label><button id="saveCustom" class="primary">Add to list</button></div></div>
<div class="modal hidden" id="pantryEditModal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Edit pantry item</h2><button id="closePantryEdit">×</button></div><label>Item name<input id="pantryEditName"></label><label class="category-label">Category<select id="pantryEditCategory"></select></label><div class="row"><label>Price<input id="pantryEditPrice" type="number" min="0" step=".01" placeholder="0.00"></label><label>Unit<input id="pantryEditUnit" placeholder="Per, Lbs, Bag…"></label></div><label class="note-label">Note (optional)<input id="pantryEditNote" placeholder="Add a note…"></label><button id="savePantryEdit" class="primary">Save changes</button><button id="deletePantryItem" class="delete-btn">Delete item</button></div></div><div class="modal hidden" id="editModal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Edit item</h2><button id="closeEdit">×</button></div><div class="edit-item-name" id="editItemName"></div><label>Price<input id="editPrice" type="number" min="0" step=".01" placeholder="0.00"></label><label class="note-label">Note (optional)<input id="editNote" placeholder="Add a note…"></label><button id="saveEdit" class="primary">Save</button></div></div><div class="modal hidden" id="recipeEditModal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2 id="recipeEditTitle">Add recipe</h2><button id="closeRecipeEdit">×</button></div><label>Recipe name<input id="recipeEditName" placeholder="Recipe name"></label><div class="recipe-editor-head"><strong>Ingredients</strong><button id="addIngredientRow" class="small-outline">+ Ingredient</button></div><div id="recipeIngredientEditor"></div><button id="saveRecipe" class="primary">Save recipe</button><button id="deleteRecipe" class="delete-btn hidden">Delete recipe</button></div></div><div class="toast hidden" id="toast"></div><script src="app.js?v=20"></script>
</body></html>
