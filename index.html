<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f5"><title>Shopping List</title><link rel="stylesheet" href="styles.css?v=50">
<link rel="icon" type="image/svg+xml" href="app-icon.svg?v=1"><link rel="apple-touch-icon" sizes="180x180" href="53545E16-57EF-4B64-8F9D-4209DFFF6CCE.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0c343d"></head>
<body>
<div class="app">
<header><div class="header-title-row"><h1 id="title">Shopping List</h1><div id="presenceIndicator" class="presence-indicator hidden" aria-label="Family online"><span class="presence-dot"></span><span id="presenceText">1 online</span></div></div></header>
<main>
<section id="shoppingView">
<div class="summary"><div><strong id="itemCount">0 items</strong><span>on your list</span></div><div class="total"><span>Estimated</span><strong id="total">$0.00</strong></div></div>
<div id="shoppingGroups"></div>
<div id="completedWrap" class="completed-wrap hidden"><div class="section-toggle cart-heading"><span>Cart</span><span id="completedCount">0</span></div><div id="completedList"></div><button id="clearPurchased" class="text-btn">Clear cart</button></div>
</section>
<section id="pantryView" class="hidden">
<div class="search"><span>⌕</span><input id="search" placeholder="Search pantry…" autocomplete="off"></div>
<div class="chips" id="chips"></div><div id="pantryList"></div><button class="missing-item hidden" id="missingItem">Item missing? Click here to add it</button>
</section>
<section id="plannerView" class="hidden"><div class="planner-week-static"><div class="planner-week-title planner-week-nav"><button id="plannerPrevWeek" aria-label="Previous week">‹</button><div><strong id="plannerWeekLabel">This Week</strong><span>Dinner Plan</span></div><button id="plannerNextWeek" aria-label="Next week">›</button></div>
<div class="planner-days-static">
<button class="planner-day-static" type="button"><strong>Monday</strong><span>+ Add dinner</span><b>›</b></button><button class="planner-day-static" type="button"><strong>Tuesday</strong><span>+ Add dinner</span><b>›</b></button><button class="planner-day-static" type="button"><strong>Wednesday</strong><span>+ Add dinner</span><b>›</b></button><button class="planner-day-static" type="button"><strong>Thursday</strong><span>+ Add dinner</span><b>›</b></button><button class="planner-day-static" type="button"><strong>Friday</strong><span>+ Add dinner</span><b>›</b></button><button class="planner-day-static" type="button"><strong>Saturday</strong><span>+ Add dinner</span><b>›</b></button><button class="planner-day-static" type="button"><strong>Sunday</strong><span>+ Add dinner</span><b>›</b></button>
</div></div></section>
<section id="recipesView" class="hidden">
<div class="recipe-tools"><div class="search"><span>⌕</span><input id="recipeSearch" placeholder="Search recipes…" autocomplete="off"></div><button class="recipe-top-add" id="addRecipeBtn">New Recipe</button></div>
<div id="recipeCategoryTabs" class="recipe-category-tabs">
<button type="button" class="active" data-recipe-category="Main Dishes">Main Dishes</button>
<button type="button" data-recipe-category="Side Dishes">Side Dishes</button>
<button type="button" data-recipe-category="Vegetables">Vegetables</button>
</div>
<div id="recipeList"></div>
</section>
</main><button class="fab" id="addBtn" aria-label="Add item">Add Item?</button>
<nav><button data-view="shopping" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7M10 20h.01M18 20h.01"/></svg></span>Shopping</button><button data-view="pantry"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM5 9h14M12 9v12M8 6h3M14 6h2M8 13h1M15 13h1"/></svg></span>Pantry</button><button data-view="recipes"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11a3 3 0 0 1 3 3v16a3 3 0 0 0-3-3H7.5A3.5 3.5 0 0 0 4 21.5zM20 5.5A3.5 3.5 0 0 0 16.5 2H14v19a3 3 0 0 1 3-3h-.5a3.5 3.5 0 0 1 3.5 3.5z"/></svg></span>Recipes</button><button id="plannerPreviewBtn" type="button"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2zM7 2v4M17 2v4M3 9h18M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></svg></span>Planner</button></nav>
</div>
<div class="modal hidden" id="modal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Add item</h2><button id="closeModal">×</button></div><label>Item name<input id="customName" placeholder="What do you need?"></label><label class="category-label">Category<select id="customCategory"></select></label><div class="row"><label>Quantity<input id="customQty" type="number" min="1" value="1"></label><label>Price<input id="customPrice" type="number" min="0" step=".01" placeholder="0.00"></label></div><label class="note-label">Note (optional)<input id="customNote" placeholder="Add a note…"></label><button id="saveCustom" class="primary">Add to list</button></div></div>
<div class="modal hidden" id="pantryEditModal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Edit pantry item</h2><button id="closePantryEdit">×</button></div><label>Item name<input id="pantryEditName"></label><label class="category-label">Category<select id="pantryEditCategory"></select></label><div class="row"><label>Price<input id="pantryEditPrice" type="number" min="0" step=".01" placeholder="0.00"></label><label>Unit<input id="pantryEditUnit" placeholder="Per, Lbs, Bag…"></label></div><label class="note-label">Note (optional)<input id="pantryEditNote" placeholder="Add a note…"></label><button id="savePantryEdit" class="primary">Save changes</button><button id="deletePantryItem" class="delete-btn">Delete item</button></div></div><div class="modal hidden" id="editModal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Edit item</h2><button id="closeEdit">×</button></div><div class="edit-item-name" id="editItemName"></div><label>Price<input id="editPrice" type="number" min="0" step=".01" placeholder="0.00"></label><label class="note-label">Note (optional)<input id="editNote" placeholder="Add a note…"></label><button id="saveEdit" class="primary">Save</button></div></div><div class="modal hidden" id="recipeEditModal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2 id="recipeEditTitle">Add recipe</h2><button id="closeRecipeEdit">×</button></div><label>Recipe name<input id="recipeEditName" placeholder="Recipe name"></label><label class="field-label" for="recipeEditCategory">Category</label><select id="recipeEditCategory"><option>Main Dishes</option><option>Side Dishes</option><option>Vegetables</option></select><div class="recipe-editor-head"><strong>Ingredients</strong><button id="addIngredientRow" class="small-outline">+ Ingredient</button></div><div id="recipeIngredientEditor"></div><button id="saveRecipe" class="primary">Save recipe</button><button id="deleteRecipe" class="delete-btn hidden">Delete recipe</button></div></div><div class="modal hidden" id="plannerDinnerModal"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2 id="plannerDinnerTitle">Add Dinner</h2><button id="plannerDinnerClose">×</button></div><label>Main Dish<div class="planner-select-add"><select id="plannerDinnerRecipe"><option value="">Select a main dish…</option></select><button type="button" class="planner-new-recipe" data-category="Main Dishes" aria-label="New main dish">＋</button></div></label><div class="planner-pair"><label>Vegetable <small>optional</small><div class="planner-select-add"><select id="plannerDinnerVegetable"><option value="">None</option></select><button type="button" class="planner-new-recipe" data-category="Vegetables" aria-label="New vegetable">＋</button></div></label><label>Side Dish <small>optional</small><div class="planner-select-add"><select id="plannerDinnerSide"><option value="">None</option></select><button type="button" class="planner-new-recipe" data-category="Side Dishes" aria-label="New side dish">＋</button></div></label></div><div class="or-line"><span>or</span></div><label>Custom dinner<input id="plannerDinnerCustom" placeholder="Pizza, Leftovers, Eat out…"></label><div id="plannerDinnerIngredients" class="planner-dinner-ingredients hidden"></div><button id="plannerDinnerPreviewSave" class="primary">Save dinner</button><button id="plannerDinnerClear" class="delete-btn hidden">Clear this day</button><p class="planner-preview-note">Dinner will be saved to this week.</p></div></div><div class="toast hidden" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=51"></script>
<script>
(function(){
  const btn=document.getElementById('plannerPreviewBtn');
  let plannerWeekOffset=0;
  const weekLabel=document.getElementById('plannerWeekLabel');
  const prevWeek=document.getElementById('plannerPrevWeek');
  const nextWeek=document.getElementById('plannerNextWeek');
  function updatePlannerWeek(){
    const d=new Date(); d.setHours(12,0,0,0);
    const mondayOffset=(d.getDay()+6)%7;
    d.setDate(d.getDate()-mondayOffset+(plannerWeekOffset*7));
    const end=new Date(d); end.setDate(end.getDate()+6);
    const fmt=x=>x.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    if(weekLabel) weekLabel.textContent=plannerWeekOffset===0?'This Week · '+fmt(d)+' – '+fmt(end):fmt(d)+' – '+fmt(end);
    document.querySelectorAll('.planner-day-static').forEach((row,i)=>{
      const x=new Date(d); x.setDate(x.getDate()+i);
      let date=row.querySelector('.planner-day-date');
      if(!date){date=document.createElement('small');date.className='planner-day-date';row.querySelector('strong')?.insertAdjacentElement('afterend',date);}
      date.textContent=x.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    });
  }
  if(prevWeek) prevWeek.addEventListener('click',()=>{plannerWeekOffset--;updatePlannerWeek()});
  if(nextWeek) nextWeek.addEventListener('click',()=>{plannerWeekOffset++;updatePlannerWeek()});
  updatePlannerWeek();
  const dinnerModal=document.getElementById('plannerDinnerModal');
  const dinnerTitle=document.getElementById('plannerDinnerTitle');
  const dinnerClose=document.getElementById('plannerDinnerClose');
  const dinnerRecipe=document.getElementById('plannerDinnerRecipe');
  const dinnerCustom=document.getElementById('plannerDinnerCustom');
  const dinnerVegetable=document.getElementById('plannerDinnerVegetable');
  const dinnerSide=document.getElementById('plannerDinnerSide');
  const dinnerIngredients=document.getElementById('plannerDinnerIngredients');
  function showPlannerIngredients(){
    const selections=[
      ['Main Dish',dinnerRecipe?.value||''],
      ['Vegetable',dinnerVegetable?.value||''],
      ['Side Dish',dinnerSide?.value||'']
    ].filter(x=>x[1]);
    if(!selections.length){dinnerIngredients.innerHTML='';dinnerIngredients.classList.add('hidden');return}
    const cards=[...document.querySelectorAll('.recipe-card')];
    let groups='';
    selections.forEach(([kind,name])=>{
      const card=cards.find(x=>x.querySelector('.recipe-head > span:first-child')?.textContent.trim()===name);
      const rows=card?[...card.querySelectorAll('.recipe-ing')]:[];
      if(!rows.length)return;
      groups+='<div class="planner-ing-group"><div class="planner-ing-title">'+kind+' · '+name.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</div>'+rows.map(r=>{
        const label=r.querySelector('span')?.textContent.trim()||'';
        const added=r.querySelector('.recipe-add')?.classList.contains('added');
        const addBtn=r.querySelector('.recipe-add'); const m=addBtn?.getAttribute('onclick')?.match(/\((\d+)\)/); const ingredientId=m?Number(m[1]):null;
        return '<div class="planner-ing-row"><span>'+label.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</span><button class="planner-ing-toggle '+(added?'added':'')+'" data-ingredient-id="'+(ingredientId||'')+'">'+(added?'✓ Added':'+ Add')+'</button></div>';
      }).join('')+'</div>';
    });
    if(!groups){dinnerIngredients.innerHTML='';dinnerIngredients.classList.add('hidden');return}
    dinnerIngredients.innerHTML=groups;
    dinnerIngredients.classList.remove('hidden');
    dinnerIngredients.querySelectorAll('.planner-ing-toggle').forEach(b=>b.addEventListener('click',async e=>{
      e.preventDefault();e.stopPropagation();
      const id=Number(b.dataset.ingredientId);if(!id||typeof addRecipeIngredient!=='function')return;
      b.disabled=true;try{await addRecipeIngredient(id);showPlannerIngredients()}finally{b.disabled=false}
    }));
  }
  document.querySelectorAll('.planner-day-static').forEach(day=>{
    day.addEventListener('click',()=>{
      const dayName=day.querySelector('strong')?.textContent||'Dinner';
      dinnerTitle.textContent=dayName+' Dinner';
      const cards=[...document.querySelectorAll('.recipe-card')];
      const namesFor=cat=>cards.filter(x=>(x.closest('.recipe-swipe-row')?.dataset.recipeCategory||'Main Dishes')===cat).map(x=>x.querySelector('.recipe-head > span:first-child')?.textContent.trim()).filter(Boolean);
      const opts=names=>names.map(n=>'<option>'+n.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</option>').join('');
      dinnerRecipe.innerHTML='<option value="">Select a main dish…</option>'+opts(namesFor('Main Dishes'));
      dinnerVegetable.innerHTML='<option value="">None</option>'+opts(namesFor('Vegetables'));
      dinnerSide.innerHTML='<option value="">None</option>'+opts(namesFor('Side Dishes'));
      dinnerRecipe.value=''; dinnerVegetable.value=''; dinnerSide.value=''; dinnerCustom.value=''; showPlannerIngredients();
      dinnerModal.classList.remove('hidden');
    });
  });
  document.querySelectorAll('.planner-new-recipe').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();
    const category=b.dataset.category||'Main Dishes';
    dinnerModal.classList.add('hidden');
    if(typeof openRecipeEditor==='function'){
      openRecipeEditor();
      if(typeof recipeEditCategory!=='undefined'&&recipeEditCategory)recipeEditCategory.value=category;
    }
  }));
  if(dinnerClose)dinnerClose.addEventListener('click',()=>dinnerModal.classList.add('hidden'));
  if(dinnerModal)dinnerModal.addEventListener('click',e=>{if(e.target===dinnerModal)dinnerModal.classList.add('hidden')});
  if(dinnerRecipe)dinnerRecipe.addEventListener('change',()=>{if(dinnerRecipe.value)dinnerCustom.value='';showPlannerIngredients()});
  if(dinnerVegetable)dinnerVegetable.addEventListener('change',showPlannerIngredients);
  if(dinnerSide)dinnerSide.addEventListener('change',showPlannerIngredients);
  if(dinnerCustom)dinnerCustom.addEventListener('input',()=>{if(dinnerCustom.value.trim())dinnerRecipe.value=''});
  const previewSave=document.getElementById('plannerDinnerPreviewSave');
  let plannerSelectedDay=null;
  let plannerCurrentRows=[];
  const plannerClear=document.getElementById('plannerDinnerClear');
  const plannerApi=async(path,opt={})=>{
    const r=await fetch('https://uinhyjqsqrgfczqrmcya.supabase.co/rest/v1/'+path,{...opt,headers:{'apikey':'sb_publishable_qmrBMbSlLInIYT2IXwy49Q_WnMiToQJ','Content-Type':'application/json','Prefer':'return=representation',...(opt.headers||{})}});
    if(!r.ok)throw new Error(await r.text()); return r.status===204?null:r.json();
  };
  function plannerWeekKey(){
    const d=new Date(); d.setHours(12,0,0,0); const mo=(d.getDay()+6)%7; d.setDate(d.getDate()-mo+(plannerWeekOffset*7));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function plannerRecipeId(name){
    const cards=[...document.querySelectorAll('.recipe-card')];
    const card=cards.find(x=>x.querySelector('.recipe-head > span:first-child')?.textContent.trim()===name);
    const edit=card?.querySelector('.swipe-edit'); const m=edit?.getAttribute('onclick')?.match(/\((\d+)\)/); return m?Number(m[1]):null;
  }
  async function loadPlannerWeek(){
    try{
      const rows=await plannerApi('shop_meal_plan?week_start=eq.'+plannerWeekKey()+'&select=*'); plannerCurrentRows=rows;
      document.querySelectorAll('.planner-day-static').forEach((day,i)=>{
        const row=rows.find(x=>x.day_index===i), target=day.querySelector('span');
        if(row){
          let label=row.custom_meal||'Planned dinner';
          if(row.recipe_id){
            const card=[...document.querySelectorAll('.recipe-card')].find(x=>x.querySelector('.swipe-edit')?.getAttribute('onclick')?.includes('('+row.recipe_id+')'));
            label=card?.querySelector('.recipe-head > span:first-child')?.textContent.trim()||label;
          }
          target.innerHTML='<span class="planner-main-label">'+label.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</span>';
          const extras=[];
          const recipeNameById=id=>{if(!id)return '';const card=[...document.querySelectorAll('.recipe-card')].find(x=>x.querySelector('.swipe-edit')?.getAttribute('onclick')?.includes('('+id+')'));return card?.querySelector('.recipe-head > span:first-child')?.textContent.trim()||''};
          const veg=recipeNameById(row.vegetable_recipe_id), side=recipeNameById(row.side_recipe_id);
          if(veg)extras.push(veg); if(side)extras.push(side);
          if(extras.length)target.insertAdjacentHTML('beforeend','<small class="planner-meal-extras">'+extras.map(x=>x.replaceAll('&','&amp;').replaceAll('<','&lt;')).join(' · ')+'</small>');
          day.classList.add('planned'); day.dataset.planId=row.id;
        }else{target.textContent='+ Add dinner';day.classList.remove('planned');delete day.dataset.planId}
      });
    }catch(e){}
  }
  document.querySelectorAll('.planner-day-static').forEach((day,i)=>day.addEventListener('click',()=>{
    plannerSelectedDay=i;
    const row=plannerCurrentRows.find(x=>x.day_index===i);
    dinnerCustom.value=row?.custom_meal||'';
    const recipeNameById=id=>{if(!id)return '';const card=[...document.querySelectorAll('.recipe-card')].find(x=>x.querySelector('.swipe-edit')?.getAttribute('onclick')?.includes('('+id+')'));return card?.querySelector('.recipe-head > span:first-child')?.textContent.trim()||''};
    dinnerVegetable.value=recipeNameById(row?.vegetable_recipe_id);
    dinnerSide.value=recipeNameById(row?.side_recipe_id);
    if(row?.recipe_id){
      const card=[...document.querySelectorAll('.recipe-card')].find(x=>x.querySelector('.swipe-edit')?.getAttribute('onclick')?.includes('('+row.recipe_id+')'));
      dinnerRecipe.value=card?.querySelector('.recipe-head > span:first-child')?.textContent.trim()||'';
    }else dinnerRecipe.value='';
    showPlannerIngredients(); plannerClear.classList.toggle('hidden',!row);
  }));
  if(previewSave)previewSave.addEventListener('click',async()=>{
    if(plannerSelectedDay===null)return;
    const recipeName=dinnerRecipe.value, custom=dinnerCustom.value.trim();
    if(!recipeName&&!custom)return;
    const day=document.querySelectorAll('.planner-day-static')[plannerSelectedDay];
    const body={week_start:plannerWeekKey(),day_index:plannerSelectedDay,recipe_id:recipeName?plannerRecipeId(recipeName):null,vegetable_recipe_id:dinnerVegetable.value?plannerRecipeId(dinnerVegetable.value):null,side_recipe_id:dinnerSide.value?plannerRecipeId(dinnerSide.value):null,custom_meal:custom||null,updated_at:new Date().toISOString()};
    try{
      if(day.dataset.planId)await plannerApi('shop_meal_plan?id=eq.'+day.dataset.planId,{method:'PATCH',body:JSON.stringify(body)});
      else await plannerApi('shop_meal_plan',{method:'POST',body:JSON.stringify(body)});
      dinnerModal.classList.add('hidden'); await loadPlannerWeek();
    }catch(e){}
  });
  if(plannerClear)plannerClear.addEventListener('click',async()=>{
    if(plannerSelectedDay===null)return;
    const row=plannerCurrentRows.find(x=>x.day_index===plannerSelectedDay);
    if(!row)return;
    try{
      await plannerApi('shop_meal_plan?id=eq.'+row.id,{method:'DELETE'});
      dinnerModal.classList.add('hidden'); await loadPlannerWeek();
    }catch(e){}
  });
  if(prevWeek)prevWeek.addEventListener('click',()=>setTimeout(loadPlannerWeek,0));
  if(nextWeek)nextWeek.addEventListener('click',()=>setTimeout(loadPlannerWeek,0));
  btn.addEventListener('click',()=>setTimeout(loadPlannerWeek,0));
  const planner=document.getElementById('plannerView');
  if(!btn||!planner)return;
  btn.addEventListener('click',function(){
    document.querySelectorAll('main > section').forEach(s=>s.classList.add('hidden'));
    planner.classList.remove('hidden');
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t=document.getElementById('title'); if(t)t.textContent='Meal Planner';
    const a=document.getElementById('addBtn'); if(a)a.classList.add('hidden');
  });
  document.querySelectorAll('nav button[data-view]').forEach(b=>b.addEventListener('click',function(){
    planner.classList.add('hidden');
  }));
})();
</script>
<script>
(()=>{
 const tabs=document.getElementById('recipeCategoryTabs'); if(!tabs)return;
 let active='Main Dishes';
 function applyRecipeCategory(){
   document.querySelectorAll('#recipeList .recipe-card').forEach(card=>{
     const wrap=card.closest('.recipe-swipe-row')||card;
     const cat=wrap.dataset.recipeCategory||card.dataset.recipeCategory||'Main Dishes';
     wrap.style.display=cat===active?'':'none';
   });
 }
 tabs.addEventListener('click',e=>{
   const b=e.target.closest('[data-recipe-category]'); if(!b)return;
   active=b.dataset.recipeCategory;
   tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
   applyRecipeCategory();
 });
 new MutationObserver(applyRecipeCategory).observe(document.getElementById('recipeList'),{childList:true,subtree:true});
 applyRecipeCategory();
})();
</script>
</body></html>
